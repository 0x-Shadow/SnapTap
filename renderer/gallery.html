<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' data:; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="gallery-body">
  <div id="gallery-container">
    <div id="gallery-header">
      <div id="gallery-header-left">
        <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <circle cx="8.5" cy="8.5" r="1.5"/>
          <polyline points="21 15 16 10 5 21"/>
        </svg>
        <span id="gallery-title">SnapTap Gallery</span>
      </div>
      <div id="gallery-header-right">
        <span id="gallery-count">0</span>
        <button id="gallery-close">&times;</button>
      </div>
    </div>
    <div id="lightbox" class="hidden">
      <div id="lightbox-backdrop"></div>
      <div id="lightbox-content">
        <div id="lightbox-header">
          <span id="lightbox-title">Screenshot</span>
          <button id="lightbox-close">&times;</button>
        </div>
        <img id="lightbox-image" alt="Screenshot enlarged">
        <div id="lightbox-footer">
          <span id="lightbox-time"></span>
          <div id="lightbox-actions">
            <button id="lightbox-copy" class="gallery-btn" title="Copy to clipboard">
              <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
            <button id="lightbox-delete" class="gallery-btn gallery-delete" title="Delete">
              <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
    <div id="gallery-grid">
      <div id="gallery-empty">
        <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
        <p>No screenshots yet</p>
        <span>Click the camera button or press Alt+S</span>
      </div>
    </div>
  </div>
  <script src="gallery.js"></script>
</body>
</html>
