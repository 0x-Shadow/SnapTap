<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data:; style-src 'self' data:; script-src 'self'">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="button-body">
  <div id="button-stack">
    <div id="screenshot-btn" title="Screenshot (Alt+S)">
      <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        <circle cx="12" cy="13" r="4"/>
      </svg>
      <div id="pulse-ring"></div>
    </div>
    <div id="gallery-btn" title="Gallery (Alt+G)">
      <svg viewBox="-1 -1 26 26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
    </div>
  </div>
  <script src="button.js"></script>
</body>
</html>
